name: Keyless release

on:
  push:
    tags:
      - "v*-prealpha.*"
      - "v*-alpha"
      - "v*-alpha.*"
      - "v*-beta"
      - "v*-beta.*"
      - "provenance-test-v*.*"

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-attest-sign-release:
    name: Build, attest, sign, and publish
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Validate protected release tag and derive its channel
        run: |
          set -euo pipefail
          version="$(bun -e 'process.stdout.write((await Bun.file("package.json").json()).version)')"
          escaped_version="${version//./\\.}"
          # Four tag shapes, deliberately narrow. `-prealpha.<n>` and `provenance-test-v…` are
          # unadvertised engineering artifacts; `-alpha` is the first advertised shape and `-beta` the
          # second, and each is accepted only because both host lanes and the client have evidence
          # against a candidate built from this code. Anything else — `-rc`, a bare `v<version>`, or a
          # shape naming a different version — is refused rather than guessed at.
          allowed="^(v${escaped_version}-prealpha\.[1-9][0-9]*|v${escaped_version}-alpha(\.[1-9][0-9]*)?|v${escaped_version}-beta(\.[1-9][0-9]*)?|provenance-test-v${escaped_version}\.[1-9][0-9]*)$"
          if [[ ! "$GITHUB_REF_NAME" =~ $allowed ]]; then
            echo "Tag must be v${version}-prealpha.<n>, v${version}-alpha[.<n>], v${version}-beta[.<n>], or provenance-test-v${version}.<n> (n >= 1)." >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "Tagged commit must be reachable from origin/main." >&2
            exit 1
          fi
          # The validated tag shape is the only thing that may promote an archive's recorded
          # qualification. `-alpha[.<n>]` and `-beta[.<n>]` are the advertised shapes; `-prealpha.<n>`
          # and `provenance-test-v…` are unadvertised engineering artifacts and stay pre-alpha. Both
          # comparisons are anchored on the whole validated tag rather than a loose `*-beta*` glob.
          # The builder accepts only these three tokens and fails closed on anything else, so a
          # future tag shape has to be mapped here deliberately instead of inheriting a claim.
          if [[ "$GITHUB_REF_NAME" == "v${version}-beta" || "$GITHUB_REF_NAME" == "v${version}-beta."* ]]; then
            release_channel=beta
          elif [[ "$GITHUB_REF_NAME" == "v${version}-alpha" || "$GITHUB_REF_NAME" == "v${version}-alpha."* ]]; then
            release_channel=alpha
          else
            release_channel=pre-alpha
          fi
          archive="dist/release/omp-session-gateway-${version}-bun.tar"
          checksums="dist/release/SHA256SUMS"
          sbom="dist/release/omp-session-gateway-${version}.spdx.json"
          {
            echo "PACKAGE_VERSION=$version"
            echo "ARCHIVE_PATH=$archive"
            echo "SBOM_PATH=$sbom"
            echo "CHECKSUM_PATH=$checksums"
            echo "OMP_RELEASE_CHANNEL=$release_channel"
          } >> "$GITHUB_ENV"


      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run release gates
        run: bun run check

      - name: Build deterministic archive
        run: |
          set -euo pipefail
          bun run release:build
          test -f "$ARCHIVE_PATH"
          test -f "$SBOM_PATH"
          test -f "$CHECKSUM_PATH"
          if [[ "$(find dist/release -maxdepth 1 -type f | wc -l | tr -d ' ')" != "3" ]]; then
            echo "Release builder emitted unexpected files." >&2
            exit 1
          fi
          (cd dist/release && sha256sum --check SHA256SUMS)

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/release/omp-session-gateway-*-bun.tar
            dist/release/omp-session-gateway-*.spdx.json
            dist/release/SHA256SUMS

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6

      - name: Sign artifacts with GitHub OIDC
        run: |
          set -euo pipefail
          for artifact in "$ARCHIVE_PATH" "$SBOM_PATH" "$CHECKSUM_PATH"; do
            cosign sign-blob --yes --bundle "${artifact}.sigstore.json" "$artifact"
          done

      - name: Verify checksums, provenance, and signatures
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          (cd dist/release && sha256sum --check SHA256SUMS)
          signer_workflow="$GITHUB_REPOSITORY/.github/workflows/release.yml"
          certificate_identity="https://github.com/${signer_workflow}@${GITHUB_REF}"
          for artifact in "$ARCHIVE_PATH" "$SBOM_PATH" "$CHECKSUM_PATH"; do
            gh attestation verify "$artifact" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$signer_workflow" \
              --source-ref "$GITHUB_REF"
            cosign verify-blob \
              --bundle "${artifact}.sigstore.json" \
              --certificate-identity "$certificate_identity" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              "$artifact"
          done

      - name: Create complete draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; refusing to mutate it." >&2
            exit 1
          fi
          notes="$RUNNER_TEMP/release-notes.md"
          upstream_commit="$(jq -r '.commit' UPSTREAM.lock.json)"
          upstream_tag="$(jq -r '.tag' UPSTREAM.lock.json)"
          if [[ "$GITHUB_REF_NAME" == provenance-test-* ]]; then
            cat > "$notes" <<EOF
          ## Provenance workflow test; not an alpha release

          This release exercises the pre-alpha build and keyless provenance path. It is not an alpha or production-qualified release.

          - Source commit: \`$GITHUB_SHA\`
          - OMP baseline: \`$upstream_commit\` (tag $upstream_tag)
          - Runtime: Bun 1.3.14 or newer
          - Registry protocol: 1
          - Verification: [docs/RELEASE.md](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_SHA/docs/RELEASE.md)
          EOF
          elif [[ "$GITHUB_REF_NAME" == *-beta* ]]; then
            cat > "$notes" <<EOF
          ## Beta release, qualified for two hosts and one client

          Beta here names a closed release channel, not a stability promise: this release is **not stable or production-qualified**. It is supported only for the combinations recorded at this exact source commit, and only against the exact patched OMP baseline named below. Everything outside that boundary is unqualified, and repository commits remain preferred there.

          ### Advertised combinations

          Unchanged from the published alpha, and advertised only because the ledger at this source commit records the evidence behind each lane.

          | role | combination |
          |---|---|
          | host | Debian 13 (trixie) x86-64, systemd 257, kernel 6.12.94+deb13-amd64 |
          | host | macOS 26.6.1 arm64 (Mac14,3) |
          | client | Chrome 151.0.7922.171 on Android 17 (Pixel 10 Pro) |

          Nothing outside that table is advertised, and passing a platform permits advertising only that exact platform and version. Per-lane evidence and the qualifying candidate are recorded in [docs/RELEASE_STATUS.md](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_SHA/docs/RELEASE_STATUS.md) and [docs/COMPATIBILITY.md](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_SHA/docs/COMPATIBILITY.md) at this source commit; this release records its own exact source commit and provenance below.

          ### Required deployment preconditions

          - Run OMP $upstream_tag at \`$upstream_commit\` **with the patch included in this archive**. Stock OMP is not sufficient at any version: the patch carries the collaboration controller, autostart, and registry publication seam the gateway depends on, and an unpatched or differently pinned OMP is unsupported. Paired OMP packaging is not provided; build and activate the versioned \`omp-gateway-patched\` executable using [the exact prerequisite route](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_SHA/patches/oh-my-pi/README.md#supported-beta-prerequisite-route-linux-and-macos).
          - Run Tailscale's **TUN-mode** client. Userspace-networking mode does not establish the listener-identity trust boundary and is refused. Never enable Tailscale Funnel.

          ### Known limitations

          - Recovery after an abrupt radio transition on Android may require force-stopping Chrome; network-change and reconnect are not proven.
          - Preview notification detail currently falls back to Session detail because the OMP publisher carries no bounded preview field.
          - Windows is implemented and tested but **not advertised**.
          - Self-hosted or proxied relay modes remain unsupported; Tailscale Serve over tailnet HTTPS is the only supported remote path.

          ### Install or upgrade

          Extract \`omp-session-gateway-${PACKAGE_VERSION}-bun.tar\`, then run \`bun apps/gateway/src/cli.js install --origin https://host.tailnet.ts.net --allow user@example.com\` with the deployment's real values. Repeat \`--allow\` for additional identities. Active reinstall preserves configuration and the publisher token.

          ### Rollback

          Run \`bun apps/gateway/src/cli.js rollback\` when the predecessor is present in managed installation history. Otherwise reinstall the signed \`v0.1.0-alpha.1\` archive with the deployment's existing origin and allowlist.

          - Source commit: \`$GITHUB_SHA\`
          - OMP baseline: \`$upstream_commit\` (tag $upstream_tag) with the included patch
          - Runtime: Bun 1.3.14; registry protocol 1; Push API 2
          - Verification: [docs/RELEASE.md](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_SHA/docs/RELEASE.md)
          EOF
          elif [[ "$GITHUB_REF_NAME" == *-alpha* ]]; then
            cat > "$notes" <<EOF
          ## Alpha point release, qualified for two hosts and one client

          This point release supersedes \`v0.1.0-alpha\` with lifecycle, capability-revocation, notification, and cross-install service hardening. Everything outside the combinations below remains unqualified.

          ### Fixed

          - Registry/SSE admission is atomic and reentrant observer failures cannot interrupt capability revocation.
          - A stale Web Push delivery cannot delete a concurrently renewed subscription.
          - A disposed collaboration client restored from Android's back/forward cache returns to the live directory without reusing its capability.
          - Install, stop, uninstall, and publisher-token rotation fail closed for foreign or unverifiable service ownership.
          - Launch rate windows are isolated by authenticated identity rather than caller-selected session IDs.

          ### Qualified

          | host | evidence |
          |---|---|
          | Debian 13 (trixie) x86-64, systemd 257, kernel 6.12.94+deb13-amd64 | signed-candidate install, upgrade/rollback, readiness, identity isolation, reboot persistence, and uninstall lanes |
          | macOS 26.6.1 arm64 (Mac14,3) | signed-candidate install, active reinstall, token rotation, identity isolation, reboot persistence, and uninstall |

          Client: Chrome 151.0.7922.171 on Android 17 (Pixel 10 Pro). The advertised hosts and client were qualified against signed candidate \`v0.1.0-prealpha.19\`; this release records its own exact source commit and provenance below.

          ### Required deployment precondition

          Run Tailscale's **TUN-mode** client. Userspace-networking mode does not establish the listener-identity trust boundary and is refused. Never enable Tailscale Funnel.

          ### Known limitations

          - Recovery after an abrupt radio transition on Android may require force-stopping Chrome; network-change and reconnect are not proven.
          - Preview notification detail currently falls back to Session detail because the OMP publisher carries no bounded preview field.
          - Windows is implemented and tested but **not advertised**.
          - Self-hosted or proxied relay modes remain unsupported.

          ### Install or upgrade

          Extract \`omp-session-gateway-${PACKAGE_VERSION}-bun.tar\`, then run \`bun apps/gateway/src/cli.js install --origin https://host.tailnet.ts.net --allow user@example.com\` with the deployment's real values. Repeat \`--allow\` for additional identities. Active reinstall preserves configuration and the publisher token.

          ### Rollback

          Run \`bun apps/gateway/src/cli.js rollback\` when the predecessor is present in managed installation history. Otherwise reinstall the signed \`v0.1.0-alpha\` archive with the deployment's existing origin and allowlist.

          - Source commit: \`$GITHUB_SHA\`
          - OMP baseline: \`$upstream_commit\` (tag $upstream_tag) with the included patch
          - Runtime: Bun 1.3.14; registry protocol 1; Push API 2
          - Verification: [docs/RELEASE.md](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_SHA/docs/RELEASE.md)
          EOF
          else
            cat > "$notes" <<EOF
          ## Pre-release qualification candidate

          This is a signed engineering candidate for the next advertised release. It is not an advertised alpha or beta, and it is not stable or production-qualified. Promotion requires the exact host/client evidence recorded at this source commit.

          ### Changes under qualification

          - Exact OMP v17.4.1 source, patch, pi-wire, provenance, and license cutover.
          - Closed beta tag/channel metadata that fails before artifact creation on unknown or stable channels.
          - Windows-only bounded readiness correction while Windows remains unadvertised.
          - Deterministic public media and documentation; no capability transport or persistence boundary changes.

          ### Security

          Collaboration capabilities remain absent from list/SSE responses, push state and payloads, URLs, browser storage, service-worker caches, logs, diagnostics, screenshots, and release fixtures. Release qualification is selected only from a validated tag shape.

          ### Required OMP prerequisite

          Run OMP $upstream_tag at \`$upstream_commit\` with the exact patch included in this archive. Stock OMP is not sufficient. Use [the versioned \`omp-gateway-patched\` route](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_SHA/patches/oh-my-pi/README.md#supported-beta-prerequisite-route-linux-and-macos); upstreaming and paired packaging are not promotion gates.

          ### Install or upgrade

          Extract \`omp-session-gateway-${PACKAGE_VERSION}-bun.tar\`, then run \`bun apps/gateway/src/cli.js install --origin https://host.tailnet.ts.net --allow user@example.com\` with the deployment's real values. Repeat \`--allow\` for additional identities. Active reinstall preserves configuration and the publisher token.

          ### Compatibility and open qualification

          - Source commit: \`$GITHUB_SHA\`
          - Exact release baseline: OMP $upstream_tag at \`$upstream_commit\` with the included patch.
          - Runtime: Bun 1.3.14; registry protocol 1; Push API 2.
          - Advertised Debian, macOS, and physical Pixel lanes must pass against these exact signed bytes before beta promotion.
          - Android network-change/reconnect remains a disclosed limitation; Windows and self-hosted/proxied relay modes remain unadvertised.

          ### Rollback

          Run \`bun apps/gateway/src/cli.js rollback\` when the predecessor is present in managed installation history. Otherwise reinstall the signed \`v0.1.0-alpha.1\` archive with the deployment's existing origin and allowlist.

          Verification instructions: [docs/RELEASE.md](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_SHA/docs/RELEASE.md).
          EOF
          fi
          gh release create "$GITHUB_REF_NAME" \
            "$ARCHIVE_PATH" \
            "$SBOM_PATH" \
            "$CHECKSUM_PATH" \
            "${ARCHIVE_PATH}.sigstore.json" \
            "${SBOM_PATH}.sigstore.json" \
            "${CHECKSUM_PATH}.sigstore.json" \
            --draft \
            --prerelease \
            --latest=false \
            --title "$GITHUB_REF_NAME" \
            --notes-file "$notes" \
            --verify-tag

      - name: Publish release once
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --latest=false
