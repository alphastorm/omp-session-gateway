name: Windows ACL helper probe

# Temporary diagnostic. The ACL helper introduced in PR #91 hung `bun test` on the Windows runner,
# and no local platform can reproduce it: the author's workstation is macOS, where every Windows path
# early-returns. This job runs the real helper against real `powershell.exe` and reports what happens,
# so the fix is driven by an observation rather than a guess. Delete once #90 is closed.

on:
  workflow_dispatch:
  push:
    branches: [fix/windows-acl-spawns]

permissions: {}

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.0.2
        with:
          bun-version: 1.3.14

      # Drive the exact spawn the daemon performs, with the exact script text, and bound every wait.
      # A bounded probe that reports "no reply in 10s" is a result; an unbounded one is another 25
      # minute cancellation with nothing learned.
      - name: Round-trip one request through the real helper
        shell: pwsh
        timeout-minutes: 4
        run: |
          bun -e @'
          const source = await Bun.file("apps/gateway/src/config.ts").text();
          const match = source.match(/const WINDOWS_ACL_HELPER_SCRIPT =([\s\S]*?);\r?\n/);
          if (!match) throw new Error("could not extract the helper script");
          const script = eval(match[1].trim());
          console.log(`script length: ${script.length}`);

          const scriptPath = `${process.env.RUNNER_TEMP}\\omp-acl-helper.ps1`;
          await Bun.write(scriptPath, script);

          // Three candidate spawns. `-Command <string>` is what the daemon does today and is the
          // one already measured as never answering. `-File` is the documented way to run a script
          // that reads its own stdin, and `-Command -` tells powershell to take commands from stdin.
          const variants = [
            ["baseline -Command", ["powershell.exe", "-NoProfile", "-NonInteractive", "-Command", script]],
            ["-File", ["powershell.exe", "-NoProfile", "-NonInteractive", "-File", scriptPath]],
            ["-File without -NonInteractive", ["powershell.exe", "-NoProfile", "-File", scriptPath]],
          ];

          for (const [label, argv] of variants) {
            const child = Bun.spawn(argv, { stdin: "pipe", stdout: "pipe", stderr: "pipe" });
            const request = JSON.stringify({ i: 1, op: "inspect", p: process.cwd(), dir: 1 });
            child.stdin.write(request + "\n");
            await child.stdin.flush();

            const reader = child.stdout.getReader();
            const started = Date.now();
            const raced = await Promise.race([
              reader.read(),
              new Promise(resolve => setTimeout(() => resolve("TIMEOUT"), 10_000)),
            ]);
            const elapsed = Date.now() - started;

            if (raced === "TIMEOUT") console.log(`RESULT ${label}: no reply within ${elapsed}ms`);
            else if (raced.done) console.log(`RESULT ${label}: stdout closed after ${elapsed}ms without a reply`);
            else console.log(`RESULT ${label}: replied in ${elapsed}ms: ${new TextDecoder().decode(raced.value).trim()}`);

            child.kill();
            const err = await Promise.race([
              new Response(child.stderr).text().catch(() => ""),
              new Promise(resolve => setTimeout(() => resolve(""), 2_000)),
            ]);
            console.log(`stderr ${label}: ${err.trim().slice(0, 600) || "(empty)"}`);
          }
          '@

      # If the round trip works, the hang is elsewhere; if it does not, this is the whole story.
      # Either way the suite is run under a hard bound so a hang reports rather than consuming the job.
      - name: Run the config suite under a bound
        shell: pwsh
        timeout-minutes: 3
        continue-on-error: true
        run: bun test apps/gateway/test/config.test.ts
