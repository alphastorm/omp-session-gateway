name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  implementation-checks:
    runs-on: ubuntu-24.04
    # Observed ~20s. A bound keeps a hung step from holding a required check for the 6h default.
    timeout-minutes: 15
    env:
      # Referenced by the upload step's `if`, which cannot read `secrets` directly. Absent on
      # Dependabot and fork pull requests, which do not receive repository secrets.
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
        if: ${{ hashFiles('bun.lock', 'bun.lockb') != '' }}
      - run: bun run check
      # A second run rather than folding `--coverage` into `bun run check`, so a coverage or upload
      # problem can never turn the required gate red. The suite is a few seconds, so the duplication
      # costs less than the coupling would.
      - run: bun run test:coverage
      - name: Upload coverage to Codecov
        if: ${{ env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov.info
          # Coverage reporting must not gate a merge on a third-party service being reachable. A
          # failed upload shows up as a stale Codecov status on the pull request instead.
          fail_ci_if_error: false

  browser-notifications:
    runs-on: ubuntu-24.04
    # Observed 2-7 min. On 2026-08-19 an Ubuntu mirror stall inside `playwright install --with-deps`
    # hung this job for 38 minutes with no output before it was cancelled by hand.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      # No --with-deps: the ubuntu-24.04 runner image already ships Chromium's shared libraries, and
      # apt was the only network dependency in this job. On 2026-08-19 an Ubuntu mirror stalled here
      # twice, once for 38 minutes before the job was cancelled by hand and once until the bound
      # below fired, both times immediately after `Get:5 noble-security InRelease`. If a library is
      # ever genuinely missing, `bun run test:browser` fails loudly on browser launch.
      - run: bunx playwright install chromium
        timeout-minutes: 10
      - run: bun run test:browser
