name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  implementation-checks:
    runs-on: ubuntu-24.04
    # Observed ~20s. A bound keeps a hung step from holding a required check for the 6h default.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
        if: ${{ hashFiles('bun.lock', 'bun.lockb') != '' }}
      - run: bun run check

  browser-notifications:
    runs-on: ubuntu-24.04
    # Observed 2-7 min. On 2026-08-19 an Ubuntu mirror stall inside `playwright install --with-deps`
    # hung this job for 38 minutes with no output before it was cancelled by hand.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      # apt is the only network dependency here and the only observed hang; bound it separately so a
      # mirror stall reads as an install failure rather than a stuck browser test.
      - run: bunx playwright install --with-deps chromium
        timeout-minutes: 10
      - run: bun run test:browser
