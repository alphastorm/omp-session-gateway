name: Keyless release

on:
  push:
    tags:
      - "v*.*.*"
      - "v*-prealpha.*"
      - "v*-alpha"
      - "v*-alpha.*"
      - "v*-beta"
      - "v*-beta.*"
      - "provenance-test-v*.*"

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-attest-sign-release:
    name: Build, attest, sign, and publish
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Validate signed release tag and derive its channel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(jq -er '.version' package.json)"
          actual_head="$(git rev-parse HEAD)"
          if [[ "$actual_head" != "$GITHUB_SHA" ]]; then
            echo "Checked-out HEAD must equal GITHUB_SHA." >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "Tagged commit must be reachable from origin/main." >&2
            exit 1
          fi
          bun scripts/release-tag-state.ts "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" "$GITHUB_SHA"
          policy_file="$RUNNER_TEMP/release-policy.env"
          bun scripts/release-policy.ts "$GITHUB_REF_NAME" "$version" STABLE_RELEASE.lock.json > "$policy_file"
          cat "$policy_file" >> "$GITHUB_ENV"
          source "$policy_file"
          if [[ "$OMP_RELEASE_CHANNEL" == "stable" ]]; then
            candidate_tag="$(jq -er '.candidateTag' STABLE_RELEASE.lock.json)"
            candidate_source="$(jq -er '.candidateSourceCommit' STABLE_RELEASE.lock.json)"
            candidate_digest="sha256:$(jq -er '.candidateArchiveSha256' STABLE_RELEASE.lock.json)"
            if ! git merge-base --is-ancestor "$candidate_source" "$GITHUB_SHA"; then
              echo "Qualified candidate source must be an ancestor of the stable source." >&2
              exit 1
            fi
            bun scripts/release-tag-state.ts "$GITHUB_REPOSITORY" "$candidate_tag" "$candidate_source"
            candidate_archive="omp-session-gateway-$version-bun.tar"
            published_digest="$(gh release view "$candidate_tag" --repo "$GITHUB_REPOSITORY" --json assets --jq ".assets[] | select(.name == \"$candidate_archive\") | .digest")"
            if [[ "$published_digest" != "$candidate_digest" ]]; then
              echo "Qualified candidate archive digest does not match the published release." >&2
              exit 1
            fi
          fi
          archive="dist/release/omp-session-gateway-$version-bun.tar"
          checksums="dist/release/SHA256SUMS"
          sbom="dist/release/omp-session-gateway-$version.spdx.json"
          {
            echo "PACKAGE_VERSION=$version"
            echo "ARCHIVE_PATH=$archive"
            echo "SBOM_PATH=$sbom"
            echo "CHECKSUM_PATH=$checksums"
          } >> "$GITHUB_ENV"


      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run release gates
        run: bun run check

      - name: Build deterministic archive
        run: |
          set -euo pipefail
          bun run release:build
          test -f "$ARCHIVE_PATH"
          test -f "$SBOM_PATH"
          test -f "$CHECKSUM_PATH"
          if [[ "$(find dist/release -maxdepth 1 -type f | wc -l | tr -d ' ')" != "3" ]]; then
            echo "Release builder emitted unexpected files." >&2
            exit 1
          fi
          (cd dist/release && sha256sum --check SHA256SUMS)

      - name: Revalidate signed tag before public provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/release-tag-state.ts "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" "$GITHUB_SHA"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/release/omp-session-gateway-*-bun.tar
            dist/release/omp-session-gateway-*.spdx.json
            dist/release/SHA256SUMS

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6

      - name: Sign artifacts with GitHub OIDC
        run: |
          set -euo pipefail
          for artifact in "$ARCHIVE_PATH" "$SBOM_PATH" "$CHECKSUM_PATH"; do
            cosign sign-blob --yes --bundle "${artifact}.sigstore.json" "$artifact"
          done

      - name: Verify checksums, provenance, and signatures
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          (cd dist/release && sha256sum --check SHA256SUMS)
          signer_workflow="$GITHUB_REPOSITORY/.github/workflows/signed-release.yml"
          certificate_identity="https://github.com/${signer_workflow}@${GITHUB_REF}"
          for artifact in "$ARCHIVE_PATH" "$SBOM_PATH" "$CHECKSUM_PATH"; do
            gh attestation verify "$artifact" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$signer_workflow" \
              --source-ref "$GITHUB_REF"
            cosign verify-blob \
              --bundle "${artifact}.sigstore.json" \
              --certificate-identity "$certificate_identity" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              "$artifact"
          done

      - name: Create complete draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; refusing to mutate it." >&2
            exit 1
          fi
          notes="$RUNNER_TEMP/release-notes.md"
          bun scripts/release-tag-state.ts "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" "$GITHUB_SHA"
          upstream_commit="$(jq -r '.commit' UPSTREAM.lock.json)"
          upstream_tag="$(jq -r '.tag' UPSTREAM.lock.json)"
          if [[ "$GITHUB_REF_NAME" == provenance-test-* ]]; then
            cat > "$notes" <<EOF
          ## Provenance workflow test; not an alpha release

          This release exercises the pre-alpha build and keyless provenance path. It is not an alpha or production-qualified release.

          - Source commit: \`$GITHUB_SHA\`
          - OMP baseline: \`$upstream_commit\` (tag $upstream_tag)
          - Runtime: Bun 1.3.14 or newer
          - Registry protocol: 1
          - Verification: [docs/RELEASE.md](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_SHA/docs/RELEASE.md)
          EOF
          elif [[ "$OMP_RELEASE_CHANNEL" == "stable" ]]; then
            cat > "$notes" <<EOF
          ## v0.2.0 — narrowly supported stable release

          This release supersedes v0.1.0 as GitHub Latest. Stable describes the exact supported matrix below; it does not claim compatibility with unnamed hosts, browsers, OMP builds, or remote-access paths.

          ### Highlights since v0.1.0

          - Couch-first triage directory: FIFO Needs-you queue with an Up-next hero, device-local Hold for desk and reversible Dismiss here, and a Settings sheet for background alerts and notification detail.
          - Long transcripts render incrementally in the embedded collaboration client: the initial snapshot defers to one loading placeholder and the transcript windows to the newest entries with a Show earlier control.
          - The pinned collaboration client ships in the precached application shell and warms while the directory idles, so View/Control taps pay only for the no-store launch request and relay connect.
          - Bounded transport recovery hardening for Android Chrome, including backoff ceilings, prolonged-outage guidance, and native EventSource reconnection support.

          ### Advertised combinations

          | role | combination |
          |---|---|
          | host | Debian 13 (trixie) x86-64 |
          | host | macOS arm64 (Mac14,3) |
          | client | Chrome on Android (Pixel 10 Pro) |

          Exact qualified OS, browser, and kernel builds, per-lane evidence, and the qualifying candidate are recorded in docs/RELEASE_STATUS.md and docs/COMPATIBILITY.md at this source commit.

          ### Required deployment preconditions

          - Run OMP $upstream_tag at $upstream_commit with the patch included in this archive. Stock OMP is not sufficient at any version. Paired OMP packaging is not provided; use the documented versioned omp-gateway-patched route.
          - Run Tailscale's TUN-mode client and Tailscale Serve over tailnet HTTPS. Userspace networking, Funnel, Portal Tunnel, and self-hosted or proxied relays are not supported.

          ### Known environment limitation

          Android Chrome can wedge its process-wide network state outside the qualified lock/Airplane/Doze transitions. Native EventSource reconnection and the bounded snapshot fallback recover the qualified cases; after an uninterrupted prolonged visible outage the loaded shell exposes force-stop/reopen help. The release does not claim page JavaScript can restart a failed browser process.
          Windows remains unadvertised. Background Web Push delivery remains best-effort and is not part of the stable core support claim.

          ### Install or upgrade

          Extract omp-session-gateway-$PACKAGE_VERSION-bun.tar, then run bun apps/gateway/src/cli.js install --origin https://host.tailnet.ts.net --allow user@example.com with the deployment's real values. Repeat --allow for additional identities. Active reinstall preserves configuration and the publisher token.

          ### Rollback

          Run bun apps/gateway/src/cli.js rollback when the predecessor is present in managed installation history. Otherwise reinstall the signed v0.1.0 stable archive with the deployment's existing origin and allowlist. Gateway rollback does not roll back the separately activated patched OMP executable.

          - Source commit: $GITHUB_SHA
          - OMP baseline: $upstream_commit (tag $upstream_tag) with the included patch
          - Runtime: Bun 1.3.14; registry protocol 1; Push API 2
          - Verification: https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_SHA/docs/RELEASE.md
          EOF
          elif [[ "$GITHUB_REF_NAME" == *-beta* ]]; then
            cat > "$notes" <<EOF
          ## Beta release, qualified for two hosts and one client

          Beta here names a closed release channel, not a stability promise: this release is **not stable or production-qualified**. It is supported only for the combinations recorded at this exact source commit, and only against the exact patched OMP baseline named below. Everything outside that boundary is unqualified, and repository commits remain preferred there.

          ### Advertised combinations

          Unchanged from the published alpha, and advertised only because the ledger at this source commit records the evidence behind each lane.

          | role | combination |
          |---|---|
          | host | Debian 13 (trixie) x86-64, systemd 257, kernel 6.12.94+deb13-amd64 |
          | host | macOS 26.6.1 arm64 (Mac14,3) |
          | client | Chrome 151.0.7922.171 on Android 17 (Pixel 10 Pro) |

          Nothing outside that table is advertised, and passing a platform permits advertising only that exact platform and version. Per-lane evidence and the qualifying candidate are recorded in [docs/RELEASE_STATUS.md](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_SHA/docs/RELEASE_STATUS.md) and [docs/COMPATIBILITY.md](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_SHA/docs/COMPATIBILITY.md) at this source commit; this release records its own exact source commit and provenance below.

          ### Required deployment preconditions

          - Run OMP $upstream_tag at $upstream_commit with the patch included in this archive. Stock OMP is not sufficient at any version: the patch carries the collaboration controller, autostart, and registry publication seam the gateway depends on, and an unpatched or differently pinned OMP is unsupported. Paired OMP packaging is not provided; build and activate the versioned omp-gateway-patched executable using [the exact prerequisite route](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_SHA/patches/oh-my-pi/README.md#supported-01-prerequisite-route-linux-and-macos).
          - Run Tailscale's **TUN-mode** client. Userspace-networking mode does not establish the listener-identity trust boundary and is refused. Never enable Tailscale Funnel.

          ### Known limitations

          - Android Chrome may require force-stop/reopen after a browser-process network wedge; the PWA keeps bounded retries and opens in-shell help after uninterrupted visible failure, but network-change recovery is not claimed.
          - Preview notification detail currently falls back to Session detail because the OMP publisher carries no bounded preview field.
          - Windows is implemented and tested but **not advertised**.
          - Self-hosted or proxied relay modes remain unsupported; Tailscale Serve over tailnet HTTPS is the only supported remote path.

          ### Install or upgrade

          Extract \`omp-session-gateway-${PACKAGE_VERSION}-bun.tar\`, then run \`bun apps/gateway/src/cli.js install --origin https://host.tailnet.ts.net --allow user@example.com\` with the deployment's real values. Repeat \`--allow\` for additional identities. Active reinstall preserves configuration and the publisher token.

          ### Rollback

          Run \`bun apps/gateway/src/cli.js rollback\` when the predecessor is present in managed installation history. Otherwise reinstall the signed \`v0.1.0-alpha.1\` archive with the deployment's existing origin and allowlist.

          - Source commit: \`$GITHUB_SHA\`
          - OMP baseline: \`$upstream_commit\` (tag $upstream_tag) with the included patch
          - Runtime: Bun 1.3.14; registry protocol 1; Push API 2
          - Verification: [docs/RELEASE.md](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_SHA/docs/RELEASE.md)
          EOF
          elif [[ "$GITHUB_REF_NAME" == *-alpha* ]]; then
            cat > "$notes" <<EOF
          ## Alpha point release, qualified for two hosts and one client

          This point release supersedes \`v0.1.0-alpha\` with lifecycle, capability-revocation, notification, and cross-install service hardening. Everything outside the combinations below remains unqualified.

          ### Fixed

          - Registry/SSE admission is atomic and reentrant observer failures cannot interrupt capability revocation.
          - A stale Web Push delivery cannot delete a concurrently renewed subscription.
          - A disposed collaboration client restored from Android's back/forward cache returns to the live directory without reusing its capability.
          - Install, stop, uninstall, and publisher-token rotation fail closed for foreign or unverifiable service ownership.
          - Launch rate windows are isolated by authenticated identity rather than caller-selected session IDs.

          ### Qualified

          | host | evidence |
          |---|---|
          | Debian 13 (trixie) x86-64, systemd 257, kernel 6.12.94+deb13-amd64 | signed-candidate install, upgrade/rollback, readiness, identity isolation, reboot persistence, and uninstall lanes |
          | macOS 26.6.1 arm64 (Mac14,3) | signed-candidate install, active reinstall, token rotation, identity isolation, reboot persistence, and uninstall |

          Client: Chrome 151.0.7922.171 on Android 17 (Pixel 10 Pro). The advertised hosts and client were last qualified against signed candidate `v0.1.0-prealpha.21`; this release records its own exact source commit and provenance below.

          ### Required deployment precondition

          Run Tailscale's **TUN-mode** client. Userspace-networking mode does not establish the listener-identity trust boundary and is refused. Never enable Tailscale Funnel.

          ### Known limitations

          - Recovery after an abrupt radio transition on Android may require force-stopping Chrome; network-change and reconnect are not proven.
          - Preview notification detail currently falls back to Session detail because the OMP publisher carries no bounded preview field.
          - Windows is implemented and tested but **not advertised**.
          - Self-hosted or proxied relay modes remain unsupported.

          ### Install or upgrade

          Extract \`omp-session-gateway-${PACKAGE_VERSION}-bun.tar\`, then run \`bun apps/gateway/src/cli.js install --origin https://host.tailnet.ts.net --allow user@example.com\` with the deployment's real values. Repeat \`--allow\` for additional identities. Active reinstall preserves configuration and the publisher token.

          ### Rollback

          Run \`bun apps/gateway/src/cli.js rollback\` when the predecessor is present in managed installation history. Otherwise reinstall the signed \`v0.1.0-alpha\` archive with the deployment's existing origin and allowlist.

          - Source commit: \`$GITHUB_SHA\`
          - OMP baseline: \`$upstream_commit\` (tag $upstream_tag) with the included patch
          - Runtime: Bun 1.3.14; registry protocol 1; Push API 2
          - Verification: [docs/RELEASE.md](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_SHA/docs/RELEASE.md)
          EOF
          else
            cat > "$notes" <<EOF
          ## Engineering test candidate

          This is a signed pre-alpha build from current development source. It is not an advertised or supported successor to v0.1.0, does not replace GitHub Latest, and does not widen the stable support matrix.

          ### Changes to test

          - Couch-flow visual pass: full-width session rows with a compact per-row Dismiss control, readable ask previews, a real empty state, and a Settings sheet for background alerts and notification detail.
          - Embedded-client transcript windowing: the initial snapshot defers to one loading placeholder and long histories render behind a Show earlier control.
          - The pinned collaboration client is precached with the application shell and warmed while the directory idles.
          - Other unreleased repository changes are recorded in CHANGELOG.md at this source commit.

          ### Required OMP prerequisite

          Run OMP $upstream_tag at $upstream_commit with the exact patch included in this archive. Stock OMP is not sufficient. Use the versioned omp-gateway-patched route; paired packaging remains deferred.

          ### Qualification boundary

          - Source commit: $GITHUB_SHA
          - Runtime: Bun 1.3.14; registry protocol 1; Push API 2.
          - Debian 13 x86-64, macOS 26.6.1 arm64 (Mac14,3), and Chrome on the physical Pixel must pass against these exact signed bytes before stable promotion.
          - The Chrome process-wide network wedge remains a disclosed environment limitation; Windows, background Push qualification, Portal Tunnel, and self-hosted/proxied relays remain outside the stable core claim.

          ### Rollback

          Run bun apps/gateway/src/cli.js rollback when the predecessor is present in managed installation history. Otherwise reinstall the signed v0.1.0 stable archive with the deployment's existing origin and allowlist.

          Verification instructions: https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_SHA/docs/RELEASE.md.
          EOF
          fi
          create_release() {
            gh release create "$GITHUB_REF_NAME" \
              "$ARCHIVE_PATH" \
              "$SBOM_PATH" \
              "$CHECKSUM_PATH" \
              "$ARCHIVE_PATH.sigstore.json" \
              "$SBOM_PATH.sigstore.json" \
              "$CHECKSUM_PATH.sigstore.json" \
              --title "$GITHUB_REF_NAME" \
              --notes-file "$notes" \
              --verify-tag \
              "$@"
          }
          if [[ "$RELEASE_IS_PRERELEASE" == "true" ]]; then
            create_release --draft --prerelease --latest=false
          else
            create_release --draft --latest=false
          fi
          draft_verified=false
          for delay in 0 2 4 8; do
            ((delay == 0)) || sleep "$delay"
            if bun scripts/release-state.ts \
              "$GITHUB_REPOSITORY" \
              "$GITHUB_REF_NAME" \
              true \
              "$RELEASE_IS_PRERELEASE" \
              false \
              dist/release; then
              draft_verified=true
              break
            fi
          done
          if [[ "$draft_verified" != "true" ]]; then
            gh release delete "$GITHUB_REF_NAME" --yes || true
            echo "Draft release verification failed; attempted to remove the draft." >&2
            exit 1
          fi

      - name: Publish release once
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bun scripts/release-tag-state.ts "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" "$GITHUB_SHA"
          if [[ "$RELEASE_IS_LATEST" == "true" ]]; then
            gh release edit "$GITHUB_REF_NAME" --draft=false --latest
          else
            gh release edit "$GITHUB_REF_NAME" --draft=false --latest=false
          fi
          published_verified=false
          for delay in 0 2 4 8; do
            ((delay == 0)) || sleep "$delay"
            if bun scripts/release-tag-state.ts "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" "$GITHUB_SHA" &&
              bun scripts/release-state.ts \
                "$GITHUB_REPOSITORY" \
                "$GITHUB_REF_NAME" \
                false \
                "$RELEASE_IS_PRERELEASE" \
                "$RELEASE_IS_LATEST" \
                dist/release; then
              published_verified=true
              break
            fi
          done
          if [[ "$published_verified" != "true" ]]; then
            gh release delete "$GITHUB_REF_NAME" --yes || true
            echo "Published release verification failed; attempted to remove the release." >&2
            exit 1
          fi
