name: Keyless release

on:
  push:
    tags:
      - "v*.*.*"
      - "v*-prealpha.*"
      - "v*-alpha"
      - "v*-alpha.*"
      - "v*-beta"
      - "v*-beta.*"
      - "provenance-test-v*.*"

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-attest-sign-release:
    name: Build, attest, sign, and publish
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0

      - name: Validate signed release tag and derive its channel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(jq -er '.version' package.json)"
          actual_head="$(git rev-parse HEAD)"
          if [[ "$actual_head" != "$GITHUB_SHA" ]]; then
            echo "Checked-out HEAD must equal GITHUB_SHA." >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "Tagged commit must be reachable from origin/main." >&2
            exit 1
          fi
          bun scripts/release-tag-state.ts "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" "$GITHUB_SHA"
          policy_file="$RUNNER_TEMP/release-policy.env"
          bun scripts/release-policy.ts "$GITHUB_REF_NAME" "$version" STABLE_RELEASE.lock.json > "$policy_file"
          cat "$policy_file" >> "$GITHUB_ENV"
          # shellcheck source=/dev/null # release-policy.ts writes this file in the step above
          source "$policy_file"
          if [[ "$OMP_RELEASE_CHANNEL" == "stable" ]]; then
            candidate_tag="$(jq -er '.candidateTag' STABLE_RELEASE.lock.json)"
            candidate_source="$(jq -er '.candidateSourceCommit' STABLE_RELEASE.lock.json)"
            candidate_digest="sha256:$(jq -er '.candidateArchiveSha256' STABLE_RELEASE.lock.json)"
            candidate_previous="$(jq -er '.previousTag' STABLE_RELEASE.lock.json)"
            published_previous="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)"
            if [[ "$candidate_previous" != "$published_previous" ]]; then
              echo "Qualified rollback predecessor must match GitHub Latest." >&2
              exit 1
            fi
            if ! git merge-base --is-ancestor "$candidate_source" "$GITHUB_SHA"; then
              echo "Qualified candidate source must be an ancestor of the stable source." >&2
              exit 1
            fi
            bun scripts/release-tag-state.ts "$GITHUB_REPOSITORY" "$candidate_tag" "$candidate_source"
            candidate_archive="omp-session-gateway-$version-bun.tar"
            published_digest="$(gh release view "$candidate_tag" --repo "$GITHUB_REPOSITORY" --json assets --jq ".assets[] | select(.name == \"$candidate_archive\") | .digest")"
            if [[ "$published_digest" != "$candidate_digest" ]]; then
              echo "Qualified candidate archive digest does not match the published release." >&2
              exit 1
            fi
            {
              echo "QUALIFIED_CANDIDATE_TAG=$candidate_tag"
              echo "QUALIFIED_CANDIDATE_SHA256=${candidate_digest#sha256:}"
              echo "QUALIFIED_PREVIOUS_TAG=$candidate_previous"
            } >> "$GITHUB_ENV"
          fi
          archive="dist/release/omp-session-gateway-$version-bun.tar"
          checksums="dist/release/SHA256SUMS"
          sbom="dist/release/omp-session-gateway-$version.spdx.json"
          {
            echo "PACKAGE_VERSION=$version"
            echo "ARCHIVE_PATH=$archive"
            echo "SBOM_PATH=$sbom"
            echo "CHECKSUM_PATH=$checksums"
          } >> "$GITHUB_ENV"


      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run release gates
        run: bun run check

      - name: Build deterministic archive
        run: |
          set -euo pipefail
          bun run release:build
          test -f "$ARCHIVE_PATH"
          test -f "$SBOM_PATH"
          test -f "$CHECKSUM_PATH"
          if [[ "$(find dist/release -maxdepth 1 -type f | wc -l | tr -d ' ')" != "3" ]]; then
            echo "Release builder emitted unexpected files." >&2
            exit 1
          fi
          (cd dist/release && sha256sum --check SHA256SUMS)

      - name: Compare stable runtime with qualified candidate
        if: env.OMP_RELEASE_CHANNEL == 'stable'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          candidate_dir="$RUNNER_TEMP/qualified-candidate"
          candidate_extract="$RUNNER_TEMP/qualified-candidate-extract"
          stable_extract="$RUNNER_TEMP/stable-extract"
          candidate_archive="omp-session-gateway-$PACKAGE_VERSION-bun.tar"
          mkdir -p "$candidate_dir" "$candidate_extract" "$stable_extract"
          gh release download "$QUALIFIED_CANDIDATE_TAG" \
            --repo "$GITHUB_REPOSITORY" --dir "$candidate_dir" --pattern "$candidate_archive"
          printf '%s  %s\n' "$QUALIFIED_CANDIDATE_SHA256" "$candidate_dir/$candidate_archive" |
            sha256sum --check -
          tar -xf "$candidate_dir/$candidate_archive" -C "$candidate_extract"
          tar -xf "$ARCHIVE_PATH" -C "$stable_extract"
          candidate_root="$candidate_extract/omp-session-gateway-$PACKAGE_VERSION-bun"
          stable_root="$stable_extract/omp-session-gateway-$PACKAGE_VERSION-bun"
          (cd "$candidate_root" && find . \( -type f -o -type l \) -print | LC_ALL=C sort) > "$RUNNER_TEMP/candidate-members.txt"
          (cd "$stable_root" && find . \( -type f -o -type l \) -print | LC_ALL=C sort) > "$RUNNER_TEMP/stable-members.txt"
          diff --unified "$RUNNER_TEMP/candidate-members.txt" "$RUNNER_TEMP/stable-members.txt"
          while IFS= read -r path; do
            case "$path" in
              ./release-info.json | ./SBOM.spdx.json | ./STABLE_RELEASE.lock.json | ./schemas/stable-release.schema.json)
                continue
                ;;
            esac
            cmp --silent "$candidate_root/$path" "$stable_root/$path"
          done < "$RUNNER_TEMP/candidate-members.txt"

      - name: Revalidate signed tag before public provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/release-tag-state.ts "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" "$GITHUB_SHA"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/release/omp-session-gateway-*-bun.tar
            dist/release/omp-session-gateway-*.spdx.json
            dist/release/SHA256SUMS

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6

      - name: Sign artifacts with GitHub OIDC
        run: |
          set -euo pipefail
          for artifact in "$ARCHIVE_PATH" "$SBOM_PATH" "$CHECKSUM_PATH"; do
            cosign sign-blob --yes --bundle "${artifact}.sigstore.json" "$artifact"
          done

      - name: Verify checksums, provenance, and signatures
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          (cd dist/release && sha256sum --check SHA256SUMS)
          signer_workflow="$GITHUB_REPOSITORY/.github/workflows/signed-release.yml"
          certificate_identity="https://github.com/${signer_workflow}@${GITHUB_REF}"
          for artifact in "$ARCHIVE_PATH" "$SBOM_PATH" "$CHECKSUM_PATH"; do
            gh attestation verify "$artifact" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$signer_workflow" \
              --source-ref "$GITHUB_REF"
            cosign verify-blob \
              --bundle "${artifact}.sigstore.json" \
              --certificate-identity "$certificate_identity" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              "$artifact"
          done

      - name: Create complete draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; refusing to mutate it." >&2
            exit 1
          fi
          notes="$RUNNER_TEMP/release-notes.md"
          bun scripts/release-tag-state.ts "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" "$GITHUB_SHA"
          upstream_commit="$(jq -r '.commit' UPSTREAM.lock.json)"
          upstream_tag="$(jq -r '.tag' UPSTREAM.lock.json)"
          if [[ "$GITHUB_REF_NAME" == provenance-test-* ]]; then
            cat > "$notes" <<EOF
          ## Provenance workflow test; not an alpha release

          This release exercises the pre-alpha build and keyless provenance path. It is not an alpha or production-qualified release.

          - Source commit: \`$GITHUB_SHA\`
          - OMP baseline: \`$upstream_commit\` (tag $upstream_tag)
          - Runtime: Bun 1.4.0 or newer
          - Registry protocol: 1
          - Verification: [docs/RELEASE.md](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_SHA/docs/RELEASE.md)
          EOF
          elif [[ "$OMP_RELEASE_CHANNEL" == "stable" ]]; then
            cat > "$notes" <<EOF
          ## v$PACKAGE_VERSION — qualified stable release

          This release supersedes $QUALIFIED_PREVIOUS_TAG as GitHub Latest. Its signed candidate qualification is recorded in docs/RELEASE_STATUS.md; planned combinations below are not evidence until that campaign passes. Supported platform families (Linux, macOS, and Windows hosts; Chromium-based browsers, Firefox, and Safari/WebKit) are tested in CI, not qualified; see docs/COMPATIBILITY.md. Neither claims unnamed hosts, browsers, OMP builds, or remote-access paths.

          ### Highlights since $QUALIFIED_PREVIOUS_TAG

          - This release carries no gateway runtime fixes since v0.7.2. The changes are qualification tooling, the planned retained Mac guest, and the OMP engineering baseline.
          - Mac persistence requires a changed guest boot identity, console login, recovered gateway readiness and doctor, and full readiness-token preservation (#349). Background-Push admission accepts any identified Pixel on Android 13+ (#350); published-byte smoke waits up to 30 seconds for the launched WebAPK task, still failing closed (#346).
          - ADR-033 (#348) plans a retained Virtualization.framework Mac guest (macOS 27.0 build 26A428, arm64, VirtualMac2,1), driven by the new Mac Studio orchestrator. This planned environment is not qualification evidence and does not cover physical firmware, FileVault, or Secure Boot.
          - The OMP engineering baseline moves to v18.4.12 (#351; canary run 37040958377). The embedded collaboration client and its 18.4.2 wire pin are unchanged; upstream Markdown-rendering changes are not imported. Mainline OMP >=18.1.20 remains required and supported.
          - View, Ask, photo-composer, native MathML, and reconnect behavior remain intact.

          ### Qualified combinations

          | role | combination |
          |---|---|
          | host | Debian 13 (trixie) x86-64 |
          | host | planned: macOS 27.0 (26A428) arm64, Virtualization.framework guest (VirtualMac2,1, ADR-033); candidate qualification pending |
          | host | Windows Server 2025 x86-64, started at interactive logon; Administrator lifecycle plus a fresh standard-user install |
          | client | planned: Chrome on the physical Pixel (Android 13+), including background Web Push; exact device and versions require campaign evidence |
          | client | Safari on iPhone and iPad, real devices in TestingBot's cloud, in the browser; iPhone background alerts in the Home Screen app |
          | client | Chrome on a Galaxy phone, a real device in TestingBot's cloud, in the browser |

          Exact qualified OS, browser, and kernel builds, per-lane evidence, and the qualifying candidate are recorded in docs/RELEASE_STATUS.md and docs/COMPATIBILITY.md at this source commit.

          ### Required deployment preconditions

          - Install mainline OMP >=18.1.20 (source reference: $upstream_tag at $upstream_commit), set collab.autoStart to control or view, and start sessions with plain omp. No gateway integration patch is required.
          - Run Tailscale's TUN-mode client and Tailscale Serve over tailnet HTTPS. Userspace networking, Funnel, Portal Tunnel, and self-hosted or proxied relays are not supported.

          ### Known environment limitation

          Android Chrome can wedge its process-wide network state outside the qualified lock/Airplane/Doze transitions. Native EventSource reconnection and the bounded snapshot fallback recover the qualified cases; after an uninterrupted prolonged visible outage the loaded shell exposes force-stop/reopen help. The release does not claim page JavaScript can restart a failed browser process.
          The Windows claim is start at interactive logon, not at boot. Background Web Push records force-stop and Doze outcomes as observed variants, never as guaranteed delivery.
          Cloud-device clients are qualified in the browser: Tailscale Serve saw the qualification workstation's login, not the phone's own, and iPhone alerts were proven with the device unlocked, not on the lock screen.

          ### Install or upgrade

          For the first upgrade from the fork-era gateway, retain its signed archive and matching private configuration, then use that archive's uninstall command to stop and unregister its service. This leaves config and installed runtimes in place; an active fork-era service cannot authenticate with the new readiness token.
          Extract omp-session-gateway-$PACKAGE_VERSION-bun.tar, then run bun apps/gateway/src/cli.js install --origin https://host.tailnet.ts.net --allow user@example.com with the deployment's real values. Repeat --allow for additional identities. Subsequent mainline reinstalls preserve configuration and the readiness token.

          ### Rollback

          Gateway rollback does not switch the separately running OMP process. The v0.7.2 predecessor embeds the same OMP 18.4.2 collaboration client; its engineering baseline is v18.4.8, while this release uses v18.4.12. rollback --to can select only the runtimes this release retained. Preserve configuration and readiness-token state; do not silently downgrade or restart OMP. Historical fork-era recovery remains a separate stopped-service procedure in docs/UPGRADE_ROLLBACK.md.

          - Source commit: $GITHUB_SHA
          - OMP source reference: $upstream_commit (tag $upstream_tag); mainline >=18.1.20 is required
          - Runtime: Bun 1.4.0; registry protocol 1; Push API 2
          - Verification: https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_SHA/docs/RELEASE.md
          EOF
          else
            cat > "$notes" <<EOF
          ## Engineering candidate ($OMP_RELEASE_CHANNEL channel)

          This is a signed $OMP_RELEASE_CHANNEL build from current development source. It is not an advertised or supported successor to the qualified stable release, does not replace GitHub Latest, and does not widen the stable support matrix.

          ### Changes to test

          - The candidate carries no gateway runtime fixes since v0.7.2. Requalify session-lifecycle and Push-triage scenarios on these exact bytes; historical receipts do not transfer.
          - The planned Mac environment is the retained Virtualization.framework guest (macOS 27.0 build 26A428, arm64, VirtualMac2,1, ADR-033), driven by the new Mac Studio orchestrator. Prove a changed guest boot identity, console login, recovered gateway readiness and doctor, and full readiness-token preservation (#349); do not claim physical firmware, FileVault, or Secure Boot coverage.
          - Exercise background-Push admission on an identified Pixel with Android 13+ (#350) and the bounded, fail-closed WebAPK task wait in published-byte smoke (#346).
          - Qualify stock OMP v18.4.12 on the host lanes (#351; canary run 37040958377 is compatibility evidence only). The embedded collaboration client and its 18.4.2 wire pin remain unchanged; upstream Markdown-rendering changes are not imported.
          - Existing View, Ask, photo-composer, native MathML, and reconnect boundaries remain intact.
          - Complete changes and source-level verification are recorded in CHANGELOG.md and docs/RELEASE_STATUS.md at this commit. Historical platform evidence does not transfer.

          ### Required OMP prerequisite

          Install mainline OMP >=18.1.20 (source reference: $upstream_tag at $upstream_commit) and set collab.autoStart to control or view. Start sessions with plain omp; the gateway reads OMP discovery and needs no integration patch.

          ### Qualification boundary

          - Source commit: $GITHUB_SHA
          - Runtime: Bun 1.4.0; registry protocol 1; Push API 2.
          - Planned qualification: Debian 13 x86-64; macOS 27.0 (26A428) arm64 in a Virtualization.framework guest (VirtualMac2,1, ADR-033); a disposable Windows Server 2025 host (the Administrator lifecycle and a fresh standard-user install); Chrome on the physical Pixel with Android 13+, including its background-Push lane; and real iPhone, iPad, and Galaxy devices in TestingBot's cloud. Every lane must pass against these exact signed bytes before stable promotion; the plan is not evidence.
          - The Chrome process-wide network wedge remains a disclosed environment limitation; Portal Tunnel and self-hosted/proxied relays remain outside the stable core claim.

          ### Rollback

          The selected predecessor is v0.7.2; pruning keeps it installed as the recorded rollback target. Gateway rollback does not switch or restart OMP. Historical fork-era recovery is documented separately in docs/UPGRADE_ROLLBACK.md.

          Before upgrading a fork-era gateway, use its matching uninstall command to stop and unregister it; retain its signed archive and private configuration for deliberate recovery. Supply the deployment's origin and allowlist on install and upgrade. Upgrades retain hostname, omitted port, identity-trust, registry settings, and authored OMP overrides; unchanged configuration bytes are not rewritten.

          Verification instructions: https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_SHA/docs/RELEASE.md.
          EOF
          fi
          create_release() {
            gh release create "$GITHUB_REF_NAME" \
              "$ARCHIVE_PATH" \
              "$SBOM_PATH" \
              "$CHECKSUM_PATH" \
              "$ARCHIVE_PATH.sigstore.json" \
              "$SBOM_PATH.sigstore.json" \
              "$CHECKSUM_PATH.sigstore.json" \
              --title "$GITHUB_REF_NAME" \
              --notes-file "$notes" \
              --verify-tag \
              "$@"
          }
          if [[ "$RELEASE_IS_PRERELEASE" == "true" ]]; then
            create_release --draft --prerelease --latest=false
          else
            create_release --draft --latest=false
          fi
          draft_verified=false
          for delay in 0 2 4 8; do
            ((delay == 0)) || sleep "$delay"
            if bun scripts/release-state.ts \
              "$GITHUB_REPOSITORY" \
              "$GITHUB_REF_NAME" \
              true \
              "$RELEASE_IS_PRERELEASE" \
              false \
              dist/release; then
              draft_verified=true
              break
            fi
          done
          if [[ "$draft_verified" != "true" ]]; then
            gh release delete "$GITHUB_REF_NAME" --yes || true
            echo "Draft release verification failed; attempted to remove the draft." >&2
            exit 1
          fi

      - name: Publish release once
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bun scripts/release-tag-state.ts "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" "$GITHUB_SHA"
          if [[ "$RELEASE_IS_LATEST" == "true" ]]; then
            published_previous="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)"
            if [[ "$published_previous" != "$QUALIFIED_PREVIOUS_TAG" ]]; then
              echo "GitHub Latest changed after qualification validation; refusing promotion." >&2
              exit 1
            fi
            gh release edit "$GITHUB_REF_NAME" --draft=false --latest
          else
            gh release edit "$GITHUB_REF_NAME" --draft=false --latest=false
          fi
          published_verified=false
          for delay in 0 2 4 8; do
            ((delay == 0)) || sleep "$delay"
            if bun scripts/release-tag-state.ts "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" "$GITHUB_SHA" &&
              bun scripts/release-state.ts \
                "$GITHUB_REPOSITORY" \
                "$GITHUB_REF_NAME" \
                false \
                "$RELEASE_IS_PRERELEASE" \
                "$RELEASE_IS_LATEST" \
                dist/release; then
              published_verified=true
              break
            fi
          done
          if [[ "$published_verified" != "true" ]]; then
            gh release delete "$GITHUB_REF_NAME" --yes || true
            echo "Published release verification failed; attempted to remove the release." >&2
            exit 1
          fi
