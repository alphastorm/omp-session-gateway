name: Platform qualification

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-service-lifecycle:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run build
      # Gateway-only gate: real Windows OMP discovery remains unqualified. Upstream registry
      # fixtures assume POSIX signal shutdown and crash Bun 1.4.0 on Windows (run 34818847249).
      # Keep upstream contract coverage on Linux ARM64; do not mask failures with skips/retries.
      - name: Validate Windows contracts and ACLs
        # Match the ACL suite's existing 20s allowance: cold PowerShell setup/inspection can
        # exceed Bun's default 5s. Keep assertions and the 25-minute job cap, without retries.
        run: bun test --timeout 20000 apps/gateway/test/config.test.ts apps/gateway/test/omp-registry.test.ts apps/gateway/test/service.test.ts apps/gateway/test/diagnostics.test.ts
      - name: Install and start current-user task
        run: bun apps/gateway/src/cli.ts install --origin https://gateway.example.ts.net --allow allowed@example.com
      - name: Verify active service
        shell: pwsh
        run: |
          $status = bun apps/gateway/src/cli.ts status | ConvertFrom-Json
          if (-not $status.installed -or -not $status.active -or -not $status.ready) {
            throw "gateway status was not installed, active, and ready"
          }
      - name: Reject another local user's readiness-token read access
        shell: pwsh
        run: |
          $tokenPath = "$env:LOCALAPPDATA\OMP Session Gateway\readiness-token"
          $ownerProbe = [System.IO.File]::OpenRead($tokenPath)
          try {
            if ($ownerProbe.ReadByte() -lt 0) { throw "current user could not read the readiness token" }
          } finally {
            $ownerProbe.Dispose()
          }
          $probePath = "$env:PUBLIC\omp-gateway-token-probe.ps1"
          @'
          param([string]$TokenPath)
          try {
            $probe = [System.IO.File]::OpenRead($TokenPath)
            $probe.Dispose()
            exit 91
          } catch [System.UnauthorizedAccessException] {
            exit 0
          } catch {
            exit 92
          }
          '@ | Set-Content -LiteralPath $probePath -Encoding utf8

          $otherUser = "ompgatewayprobe"
          $password = "Omp!" + [Guid]::NewGuid().ToString("N").Substring(0, 8) + "1"
          & net.exe user $otherUser $password /add /expires:never
          if ($LASTEXITCODE -ne 0) { throw "failed to create token ACL probe user" }
          try {
            $securePassword = ConvertTo-SecureString $password -AsPlainText -Force
            $credential = [System.Management.Automation.PSCredential]::new(
              "$env:COMPUTERNAME\$otherUser",
              $securePassword
            )
            $probeProcess = Start-Process `
              -FilePath "powershell.exe" `
              -Credential $credential `
              -ArgumentList @("-NoProfile", "-NonInteractive", "-ExecutionPolicy", "Bypass", "-File", "`"$probePath`"", "`"$tokenPath`"") `
              -Wait `
              -PassThru
            if ($probeProcess.ExitCode -ne 0) {
              throw "readiness-token read refusal failed for another local user (probe exit $($probeProcess.ExitCode))"
            }
          } finally {
            Remove-Item -LiteralPath $probePath -Force -ErrorAction SilentlyContinue
            & net.exe user $otherUser /delete | Out-Null
          }
      - name: Rotate readiness token and reinstall
        shell: pwsh
        run: |
          $token = Get-Item "$env:LOCALAPPDATA\OMP Session Gateway\readiness-token"
          $beforeWrite = $token.LastWriteTimeUtc
          Start-Sleep -Milliseconds 1100
          bun apps/gateway/src/cli.ts rotate-readiness-token
          if ($LASTEXITCODE -ne 0) { throw "token rotation failed" }
          $rotated = Get-Item "$env:LOCALAPPDATA\OMP Session Gateway\readiness-token"
          if ($rotated.LastWriteTimeUtc -le $beforeWrite) { throw "token file was not replaced" }
          # Install verifies a fresh activation nonce. Exercise a real config transition as well;
          # PID reuse and a stale CIM snapshot are not reliable activation identities.
          bun apps/gateway/src/cli.ts install --origin https://gateway.example.ts.net --allow allowed@example.com --port 4318
          if ($LASTEXITCODE -ne 0) { throw "active reinstall failed" }
          $status = bun apps/gateway/src/cli.ts status | ConvertFrom-Json
          if (-not $status.installed -or -not $status.active -or -not $status.ready) {
            throw "gateway did not recover after reinstall"
          }
          $priorListener = Get-NetTCPConnection -State Listen -ErrorAction Stop |
            Where-Object { $_.LocalPort -eq 4317 }
          if ($null -ne $priorListener) {
            throw "prior gateway listener remained after port-changing reinstall"
          }
      - name: Refuse no-stop uninstall while active
        shell: pwsh
        run: |
          bun apps/gateway/src/cli.ts uninstall --no-stop
          if ($LASTEXITCODE -eq 0) { throw "active no-stop uninstall unexpectedly succeeded" }
          $status = bun apps/gateway/src/cli.ts status | ConvertFrom-Json
          if (-not $status.installed -or -not $status.active -or -not $status.ready) {
            throw "no-stop refusal altered the active service"
          }
      - name: Uninstall current-user task
        if: always()
        shell: pwsh
        run: |
          if (Test-Path "$env:LOCALAPPDATA\OMP Session Gateway\config.json") {
            bun apps/gateway/src/cli.ts uninstall
            if ($LASTEXITCODE -ne 0) { throw "gateway uninstall failed" }
          }
          if ($null -ne (Get-ScheduledTask -TaskName 'OMP Session Gateway' -ErrorAction SilentlyContinue)) {
            throw "scheduled task remained after uninstall"
          }
          Start-Sleep -Milliseconds 500
          $process = Get-CimInstance Win32_Process |
            Where-Object { $_.Name -eq 'bun.exe' -and $_.CommandLine -like '*OMP Session Gateway\state\installation\versions\*\apps\gateway\src\cli.js*serve*' } |
            Select-Object -First 1
          if ($null -ne $process) { throw "gateway process remained after uninstall" }

  # Native aarch64 coverage for the repository's own suites and for the pinned mainline OMP source.
  #
  # Why this job exists. The real Linux lane moved from a Debian 13 aarch64 container to an x86-64
  # DigitalOcean droplet (docs/LINUX_QUALIFICATION.md section 8). That trade bought a machine that
  # boots, reboots, and carries a public address, and it cost the only aarch64 evidence in the
  # ledger: "anything architecture-sensitive is newly covered rather than re-confirmed". GitHub's
  # `ubuntu-24.04-arm` label is a native aarch64 host and is free for public repositories, which this
  # one is, so the architecture dimension can be restored for everything that does not need a
  # persistent machine, at no cost in minutes.
  #
  # What a green run proves, on aarch64:
  #   - the repository suite, every workspace typecheck, and the production PWA build;
  #   - that unmodified mainline OMP matches its commit and tree pins and its registry fixtures
  #     pass, exercising discovery and authenticated per-host socket queries. This job gates the
  #     upstream registry contract we consume, not unrelated collab/relay suites or full upstream
  #     repo checks. The Windows job above gates only gateway contracts and service lifecycle.
  #
  # What a green run does NOT prove. It is not arm64 platform qualification:
  #   - no service is installed, so nothing here bears on a host lifecycle row. `install` on Linux
  #     unconditionally runs `systemctl --user daemon-reload` and `enable`
  #     (apps/gateway/src/service.ts), which needs a `systemd --user` manager; a hosted runner has no
  #     lingering login session for its account, and the Linux implementation is systemd-only with no
  #     non-systemd init supported, so this job does not attempt it. Install, doctor, rotation,
  #     upgrade, rollback, and uninstall on Linux stay with scripts/provision-linux-qual.sh on a real
  #     machine.
  #   - no reboot and no persistence of any kind. The runner is destroyed when the job ends, so
  #     nothing measured here can be observed a second time.
  #   - no Tailscale: no Serve identity, no allowlist decision, no loopback/LAN/public isolation.
  #   - no browser and no physical Android device. `browser-notifications` in ci.yml covers Chromium
  #     on x86-64; Playwright's arm64 Chromium would add a second variable while answering no
  #     architecture-specific question.
  #   - no signed candidate artifact. This is a source checkout, like windows-service-lifecycle above.
  #   - the repository-wide gates in `bun run check` are deliberately absent. Handoff validation and
  #     the capability- and identifier-leak scans read tracked text, so they cannot differ by
  #     architecture, and duplicating them here would only make a failure ambiguous.
  #
  # Ledger bearing: evidence toward `Repository automated suite` and `Mainline OMP compatibility` on an
  # architecture neither has been run on. It closes no row, promotes nothing, and is deliberately not
  # on any required-checks list until it has proven stable.
  linux-arm64-source-checkout:
    runs-on: ubuntu-24.04-arm
    # Bound checkout, dependency installation, and gateway/registry fixtures well below the
    # six-hour runner default. This is not a full upstream typecheck or test-suite lane.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - name: Assert the runner is native aarch64
        run: |
          set -euo pipefail
          fail() { printf '::error title=%s::%s\n' "$1" "$2"; exit 1; }

          machine="$(uname -m)"
          bun_arch="$(bun --print 'process.arch')"
          bun_platform="$(bun --print 'process.platform')"
          printf 'uname -m:         %s\n' "$machine"
          printf 'kernel:           %s\n' "$(uname -sr)"
          printf 'bun version:      %s\n' "$(bun --version)"
          printf 'bun platform:     %s\n' "$bun_platform"
          printf 'bun arch:         %s\n' "$bun_arch"
          printf 'RUNNER_ARCH:      %s\n' "${RUNNER_ARCH:-<unset>}"

          # The architecture is the only reason this job exists, so it is asserted rather than
          # assumed. If GitHub ever resolves this label to an x86-64 host, or setup-bun ever installs
          # a translated x64 build, every step below would still pass and the run would be a
          # duplicate of `implementation-checks` wearing an arm64 name. That is worse than no job:
          # it would look like evidence.
          [ "$machine" = aarch64 ] ||
            fail "Runner is not aarch64" \
              "uname -m reported '$machine'. This job exists only to cover aarch64, so a green run on any other machine would be misleading evidence."
          [ "$bun_arch" = arm64 ] ||
            fail "Bun is not an arm64 build" \
              "Bun reports process.arch '$bun_arch' on an aarch64 host, so it is running translated and its native code paths are not the ones this job claims to measure."
          [ "$bun_platform" = linux ] ||
            fail "Runner is not Linux" \
              "Bun reports process.platform '$bun_platform'."
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run build
      # The repository suite runs before the pinned OMP checkout below. `bun test` with no path
      # argument was measured not to descend into dot-directories, so `.qualification/` is not swept
      # in either way; the ordering stands because the cheaper failure should come first.
      - run: bun test
      - name: Check out pinned OMP source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: can1357/oh-my-pi
          ref: 1bd60c6fbd0e800a75fd09b1e4804af5a5e6d63b
          path: .qualification/oh-my-pi
          persist-credentials: false
      - name: Verify mainline OMP source and run its registry fixtures on aarch64
        working-directory: .qualification/oh-my-pi
        run: |
          set -euo pipefail
          fail() { printf '::error title=%s::%s\n' "$1" "$2"; exit 1; }

          test "$(git rev-parse HEAD)" = 1bd60c6fbd0e800a75fd09b1e4804af5a5e6d63b
          test "$(git rev-parse 'HEAD^{tree}')" = aca949970fb8b73170b05f6a23bf18e23fb5841f
          printf 'unmodified mainline OMP v18.1.20 source verified\n'

          bun install --frozen-lockfile

          # v18.1.20 publishes the ARM64 addon. Stage it because the source workspace shadows npm.
          native_fixture="$(mktemp -d)"
          trap 'rm -rf "$native_fixture"' EXIT
          printf '%s\n' '{"private":true,"dependencies":{"@oh-my-pi/pi-natives-linux-arm64":"18.1.20"}}' >"$native_fixture/package.json"
          (cd "$native_fixture" && bun install --ignore-scripts)
          cp "$native_fixture/node_modules/@oh-my-pi/pi-natives-linux-arm64/pi_natives.linux-arm64.node" \
            packages/natives/native/pi_natives.linux-arm64.node

          bun test packages/coding-agent/test/collab/registry.test.ts \
            packages/coding-agent/test/collab/registry-smoke.test.ts \
            packages/coding-agent/test/collab/host-registry.test.ts
